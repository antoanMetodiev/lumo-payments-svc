spring.application.name=lumo-payments-svc

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health
server.port=8084

# --- Metrics (RAM/CPU tracking on Render's free tier) ---
# Pushes JVM heap/non-heap/thread/CPU metrics to Grafana Cloud via OTLP every
# 60s. GRAFANA_OTLP_ENDPOINT/GRAFANA_OTLP_AUTH come from Grafana Cloud's
# "Connections > OpenTelemetry" page and are set as Render env vars — never
# committed here. Left unset, export.enabled defaults to false and this is a
# no-op (safe for local dev).
management.otlp.metrics.export.enabled=${GRAFANA_OTLP_ENABLED:false}
management.otlp.metrics.export.url=${GRAFANA_OTLP_ENDPOINT:}
management.otlp.metrics.export.headers.Authorization=${GRAFANA_OTLP_AUTH:}
management.otlp.metrics.export.step=60s
management.otlp.metrics.export.resource-attributes.service.name=lumo-payments-svc

# Shared secret proving a request came from lumo-api-gateway (which already
# verified the caller's Clerk session) rather than from anyone who found this
# service's URL — see GatewayAuthenticationFilter. Same value as the gateway's
# and lumo-user-svc's.
internal.service-secret=${INTERNAL_SERVICE_SECRET}

# Where lumo-api-gateway lives — used by UserSyncService to sync
# subscription_type back to lumo-user-svc after a webhook changes a plan.
# Same manual local/prod swap as the gateway's own Feign clients right now:
# keep the active line pointed at localhost while developing, swap to the
# commented line before deploying.
#gateway.url=http://localhost:8080
gateway.url=https://lumo-api-gateway.onrender.com

# Stripe (see README.md for where to find these). STRIPE_WEBHOOK_SECRET_LOCAL
# is optional — set it only in local dev (the Stripe CLI's `stripe listen`
# prints its own signing secret) so the real STRIPE_WEBHOOK_SECRET never has
# to be touched. Falls through to the real one whenever unset (i.e. always,
# in production) — same pattern as CLERK_WEBHOOK_SECRET_LOCAL in lumo-user-svc.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET_LOCAL:${STRIPE_WEBHOOK_SECRET}}
stripe.pro-price-id=${STRIPE_PRO_PRICE_ID}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/}

# Resend (see EmailService) — sends the "we refunded you" email when
# SubscriptionActivationService gives up on syncing a paid Pro upgrade to
# lumo-user-svc. RESEND_FROM_EMAIL must be on a domain verified in the Resend
# account. No ops-alert inbox — if the refund itself fails after retries, or
# revoking access fails, that's a log line only (see SubscriptionActivationService).
resend.api-key=${RESEND_API_KEY}
resend.from-address=${RESEND_FROM_EMAIL}
